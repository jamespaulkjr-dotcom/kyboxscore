name: deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kyboxscore
          POSTGRES_PASSWORD: test
          POSTGRES_DB: kyboxscore_test
        options: >-
          --health-cmd "pg_isready -U kyboxscore"
          --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    env:
      DATABASE_URL: postgresql://kyboxscore:test@localhost:5432/kyboxscore_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run typecheck
      - run: npm test

  build:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Diagnoses a bad DEPLOY_KEY/DEPLOY_HOST without printing either. Shape
      # only: lengths, line counts, and the PEM banner lines, which are not
      # secret. A wrapping quote or a stray leading space is the usual cause.
      - name: Preflight secrets
        env:
          H: ${{ secrets.DEPLOY_HOST }}
          K: ${{ secrets.DEPLOY_KEY }}
        run: |
          fail=0
          if [ -z "$H" ]; then
            echo "DEPLOY_HOST: EMPTY or not set"; fail=1
          else
            echo "DEPLOY_HOST: set, ${#H} chars"
            case "$H" in
              *[\'\"]*) echo "  !! contains a quote character - remove it"; fail=1 ;;
            esac
            case "$H" in
              " "*|*" ") echo "  !! has leading or trailing whitespace"; fail=1 ;;
            esac
          fi

          if [ -z "$K" ]; then
            echo "DEPLOY_KEY: EMPTY or not set"; fail=1
          else
            echo "DEPLOY_KEY: set, ${#K} chars, $(printf '%s' "$K" | wc -l) newlines"
            first=$(printf '%s' "$K" | head -1)
            last=$(printf '%s' "$K" | tail -1)
            echo "  first line: $first"
            echo "  last line:  $last"
            case "$first" in
              "-----BEGIN "*) : ;;
              "ssh-"*) echo "  !! this is the PUBLIC key - DEPLOY_KEY needs the private half"; fail=1 ;;
              *) echo "  !! first line is not a PEM header - check for a quote or leading space"; fail=1 ;;
            esac
            case "$last" in
              "-----END "*) : ;;
              *) echo "  !! last line is not a PEM footer - the key looks truncated"; fail=1 ;;
            esac
            printf '%s' "$K" | tail -c 1 | od -c | head -1 | grep -q '\\n' \
              && echo "  trailing newline: yes" \
              || echo "  trailing newline: no (some ssh clients require one)"
          fi

          if [ "$fail" = "1" ]; then
            echo "::error::Deploy secrets look malformed - see the checks above."
            exit 1
          fi
          echo "secrets look well formed"

      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -e
            cd /home/deploy/kyboxscore
            docker compose pull web
            docker compose up -d web
            # Reference data is idempotent; fixtures are refused in production.
            docker compose exec -T web node packages/db/scripts/migrate.mjs
            docker compose exec -T web node packages/db/scripts/seed.mjs
