name: deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kyboxscore
          POSTGRES_PASSWORD: test
          POSTGRES_DB: kyboxscore_test
        options: >-
          --health-cmd "pg_isready -U kyboxscore"
          --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    env:
      DATABASE_URL: postgresql://kyboxscore:test@localhost:5432/kyboxscore_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run typecheck
      - run: npm test

  build:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # DEPLOY_KEY is pasted by hand, and hand-pasting a PEM block goes wrong
      # in a small number of predictable ways: wrapping quotes, a leading
      # space, a missing trailing newline, or the line breaks collapsed into
      # one long line. Repair those here rather than making a human spot them.
      # Nothing secret is printed - only the shape.
      - name: Prepare deploy key
        env:
          K: ${{ secrets.DEPLOY_KEY }}
          H: ${{ secrets.DEPLOY_HOST }}
        run: |
          python3 <<'EOF'
          import os, re, sys, textwrap

          k = os.environ.get("K", "")
          if not k.strip():
              print("::error::DEPLOY_KEY is empty or not set.")
              sys.exit(1)

          k = k.strip()
          # strip one layer of wrapping quotes
          if len(k) > 1 and k[0] == k[-1] and k[0] in "'\"":
              k = k[1:-1].strip()
          # a literal backslash-n paste
          if "\\n" in k and "\n" not in k:
              k = k.replace("\\n", "\n")

          if k.startswith("ssh-"):
              print("::error::DEPLOY_KEY is a PUBLIC key. It needs the private half.")
              sys.exit(1)

          m = re.search(r"-----BEGIN ([A-Z ]+)-----(.*?)-----END \1-----", k, re.S)
          if not m:
              print("::error::DEPLOY_KEY has no BEGIN/END block. Paste the whole file, no quotes.")
              print(f"  first 30 chars looked like: {k[:30]!r}")
              sys.exit(1)

          label, body = m.group(1), m.group(2)
          # collapsed to one line? rebuild the wrapping. PEM ignores where the
          # breaks fall, so re-wrapping at 70 is safe.
          compact = re.sub(r"\s+", "", body)
          rewrapped = "\n".join(textwrap.wrap(compact, 70))
          key = f"-----BEGIN {label}-----\n{rewrapped}\n-----END {label}-----\n"

          with open("/tmp/deploy_key", "w") as f:
              f.write(key)

          lines = key.strip().split("\n")
          print(f"deploy key: {label}, {len(lines)} lines, {len(compact)} base64 chars")
          if k != key.strip():
              print("note: the pasted value needed repair (quotes, whitespace or line wrapping)")

          h = os.environ.get("H", "").strip().strip("'\"").strip()
          if not h:
              print("::error::DEPLOY_HOST is empty or not set.")
              sys.exit(1)
          print(f"deploy host: {len(h)} chars")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"CLEAN_HOST={h}\n")
          EOF
          chmod 600 /tmp/deploy_key
          ssh-keygen -y -f /tmp/deploy_key > /tmp/deploy_key.pub \
            && echo "key is valid; fingerprint: $(ssh-keygen -lf /tmp/deploy_key.pub)" \
            || { echo "::error::The key is structurally intact but OpenSSH will not read it."; exit 1; }

      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.CLEAN_HOST }}
          username: deploy
          key_path: /tmp/deploy_key
          script: |
            set -e
            cd /home/deploy/kyboxscore
            docker compose pull web
            docker compose up -d web
            # Reference data is idempotent; fixtures are refused in production.
            docker compose exec -T web node packages/db/scripts/migrate.mjs
            docker compose exec -T web node packages/db/scripts/seed.mjs
